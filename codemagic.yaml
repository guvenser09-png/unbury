workflows:
  ios-testflight:
    name: Unbury iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: unbury-asc
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.unbury.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.14.0
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web bundle
        script: bash scripts/build-www.sh
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
          find ios/App -name '.DS_Store' -delete
          find ios/App -name '._*' -delete
      - name: Fetch signing files (creates bundle id + profile if missing)
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > /tmp/cert_key
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key \
            --create
      - name: Set up keychain and certificates
        script: |
          keychain initialize
          keychain add-certificates
          echo "--- signing identities in keychain ---"
          security find-identity -v -p codesigning || true
      - name: Set incremented build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-build-number 6789700779 2>/dev/null | tail -1 | tr -dc '0-9')
          if [ -z "$LATEST" ]; then NEXT="$BUILD_NUMBER"; else NEXT=$((LATEST + 1)); fi
          echo "Uploading as build number: $NEXT"
          agvtool new-version -all "$NEXT"
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
